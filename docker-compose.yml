version: "3.8"

services:
  db:
    image: postgres:15
    container_name: pi_db_monitoramento
    environment:
      POSTGRES_USER: user_univesp
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: pi_monitoramento
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    container_name: pi_backend
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - db
    command: sh -c "npx sequelize-cli db:migrate && node server.js"

  frontend:
    build: ./frontend
    container_name: pi_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - backend

  pgadmin:
    image: dpage/pgadmin4
    container_name: pi_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    depends_on:
      - db